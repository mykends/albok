name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: albok
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - run: pip install -r backend/requirements-dev.txt
      - name: Backend tests (SQLite)
        working-directory: backend
        run: python -m pytest -q
      - name: Backend tests (PostgreSQL)
        working-directory: backend
        env:
          ALBOK_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/albok
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm ci
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Desktop tests
        run: npm test
        working-directory: desktop

  images:
    # Versioned images for schools: `ALBOK_VERSION=<tag>` in deploy/.env, then `docker compose pull && docker compose up -d`.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.registry }}/albok-api:${{ steps.meta.outputs.version }},${{ steps.meta.outputs.registry }}/albok-api:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.registry }}/albok-web:${{ steps.meta.outputs.version }},${{ steps.meta.outputs.registry }}/albok-web:latest
